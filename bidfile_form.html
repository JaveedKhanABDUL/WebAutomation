<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BidFile Form Builder</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 20px; background: #f4f6f8; color: #222; }
  h1 { margin-top: 0; }
  fieldset { background: #fff; border: 1px solid #c8d0d8; border-radius: 6px; margin-bottom: 16px; }
  legend { font-weight: 600; padding: 0 8px; }
  label { display: inline-block; margin: 4px 12px 4px 0; font-size: 13px; }
  input, select { padding: 4px 6px; border: 1px solid #aab; border-radius: 4px; }
  input.num { width: 70px; }
  table { border-collapse: collapse; margin: 6px 0; }
  td, th { border: 1px solid #d5dbe1; padding: 2px 4px; font-size: 12px; }
  .card { border: 1px dashed #99a; border-radius: 6px; padding: 8px; margin: 8px 0; background: #fafbfc; overflow-x: auto; }
  button { padding: 5px 12px; border: 0; border-radius: 4px; background: #1f6feb; color: #fff; cursor: pointer; margin: 2px; }
  button.del { background: #c0392b; }
  button.alt { background: #555; }
  pre { background: #111; color: #9f9; padding: 10px; max-height: 400px; overflow: auto; }
  #fname { font-weight: 600; }
</style>
</head>
<body>
<h1>BidFile Form Builder</h1>

<fieldset>
  <legend>1. File header</legend>
  <label>Area set <input id="area" value="NORDIC"></label>
  <label>Auction name <input id="auction" value="PWR-MRC-D+1"></label>
  <label>Auction date/time (UTC) <input id="auctionDt" type="datetime-local" value="2022-07-20T10:00"></label>
  <label>Generated at (UTC) <input id="genDt" type="datetime-local" value="2022-07-20T10:35"></label>
  <label>Delivery day start (UTC) <input id="delStart" type="datetime-local" value="2022-07-20T22:00"></label>
  <label>Periods <input id="periods" class="num" type="number" min="1" max="100" value="24"></label>
  <div>File name: <span id="fname"></span></div>
</fieldset>

<fieldset>
  <legend>2. Portfolios (PO)</legend>
  <table id="poTable">
    <tr><th>Member</th><th>Portfolio</th><th>Bidding zone</th><th>Resolution (min)</th><th>Currency</th><th>Flag</th><th></th></tr>
  </table>
  <button type="button" onclick="addPO()">+ Portfolio</button>
</fieldset>

<fieldset>
  <legend>3. Curve orders (SL / PR / VL)</legend>
  <div id="curves"></div>
  <button type="button" onclick="addCurve()">+ Curve order</button>
</fieldset>

<fieldset>
  <legend>4. Block orders (SB / BI / BL)</legend>
  <div id="blocks"></div>
  <button type="button" onclick="addBlock()">+ Block submission</button>
</fieldset>

<button type="button" onclick="generate()">Generate CSV</button>
<button type="button" class="alt" onclick="download()">Download</button>
<pre id="out"></pre>

<script>
const $ = id => document.getElementById(id);
const ZONES = ['DK1-ENDK','DK2-ENDK','NO1-STATNETT','NO2-STATNETT','NO3-STATNETT','NO4-STATNETT','NO5-STATNETT','SE1-SVK','SE2-SVK','SE3-SVK','SE4-SVK','FI-FINGRID'];
let idCounter = 10000100000000;
const nextId = () => ++idCounter;

const iso = v => v ? v.length === 16 ? v + ':00Z' : v + 'Z' : '';
const dec = v => String(v === '' || v == null ? '' : v).replace('.', ',');
const num = v => parseFloat(String(v).replace(',', '.')) || 0;
const dec1 = v => v === '' ? '' : (Number.isInteger(num(v)) ? num(v).toFixed(1).replace('.', ',') : dec(v));
const fmtSum = x => { const s = (Math.round(x * 1e6) / 1e6).toString().replace('.', ','); return s.includes(',') || x === 0 ? s : s + ',0'; };
const addHours = (v, h) => { const d = new Date(v + ':00Z'); d.setUTCHours(d.getUTCHours() + h); return d.toISOString().slice(0, 19) + 'Z'; };
const stamp = v => v.replace(/[-:T]/g, '').slice(0, 14).padEnd(14, '0');
const nPeriods = () => Math.max(1, +$('periods').value || 1);

function updateName() {
  $('fname').textContent = `BidFile_${$('area').value}_${$('auction').value}_${stamp($('auctionDt').value)}_${stamp($('genDt').value)}.csv`;
}
['area','auction','auctionDt','genDt'].forEach(i => $(i).addEventListener('input', updateName));
$('periods').addEventListener('change', () => { document.querySelectorAll('.curve').forEach(rebuildGrid); document.querySelectorAll('.block').forEach(rebuildBlockRows); });

function addPO(v = {}) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input class="m" value="${v.m || ''}"></td><td><input class="p" value="${v.p || ''}"></td>
    <td><select class="z">${ZONES.map(z => `<option ${z === v.z ? 'selected' : ''}>${z}</option>`).join('')}</select></td>
    <td><input class="r num" value="60"></td><td><input class="c num" value="EUR"></td><td><input class="f num" value="N"></td>
    <td><button type="button" class="del" onclick="this.closest('tr').remove()">x</button></td>`;
  $('poTable').appendChild(tr);
}

function addCurve() {
  const d = document.createElement('div');
  d.className = 'card curve';
  d.innerHTML = `<label>User <input class="u"></label><label>Member <input class="m"></label>
    <label>Submitted (UTC) <input class="t" type="datetime-local"></label>
    <label>Active <select class="a"><option>Y</option><option>N</option></select></label>
    <button type="button" class="del" onclick="this.closest('.curve').remove()">Remove order</button><br>
    <label>Price points (EUR/MWh, comma-separated) <input class="prices" size="60" value="-500, 19.9, 20, 450, 450.1, 600, 600.1, 4000"></label>
    <button type="button" class="alt" onclick="rebuildGrid(this.closest('.curve'))">Update grid</button>
    <div class="grid"></div>`;
  $('curves').appendChild(d);
  rebuildGrid(d);
}

function rebuildGrid(card) {
  const prices = card.querySelector('.prices').value.split(',').map(s => s.trim()).filter(Boolean);
  let h = '<table><tr><th>Period (UTC)</th><th>Exec (MW)</th>' + prices.map(p => `<th>${p}</th>`).join('') + '</tr>';
  for (let i = 0; i < nPeriods(); i++) {
    h += `<tr class="vl"><td class="pt">${i}</td><td><input class="num e" value="0"></td>` +
      prices.map(() => '<td><input class="num v"></td>').join('') + '</tr>';
  }
  card.querySelector('.grid').innerHTML = h + '</table>';
}

function addBlock() {
  const d = document.createElement('div');
  d.className = 'card block';
  d.innerHTML = `<label>User <input class="u"></label><label>Member <input class="m"></label>
    <label>Submitted (UTC) <input class="t" type="datetime-local"></label>
    <button type="button" class="del" onclick="this.closest('.block').remove()">Remove submission</button><br>
    <button type="button" class="alt" onclick="addBlockRow(this.closest('.block'))">+ Block</button>
    <div class="rows"></div>`;
  $('blocks').appendChild(d);
  addBlockRow(d);
}

function addBlockRow(card) {
  const n = nPeriods();
  const row = document.createElement('div');
  row.className = 'brow';
  row.innerHTML = `<label>Active <select class="a"><option>Y</option><option>N</option></select></label>
    <label>Exec <input class="num ex" placeholder="auto" title="empty = sum of volumes"></label><label>MAR <input class="num mar" value="1,00"></label>
    <label>AAR <input class="num aar" value="1"></label><label>Code <input class="num code" value="C01"></label>
    <label>Price <input class="num price"></label>
    <button type="button" class="del" onclick="this.closest('.brow').remove()">x</button>
    <table><tr>${Array.from({length: n}, (_, i) => `<th>${i}</th>`).join('')}</tr>
    <tr>${Array.from({length: n}, () => '<td><input class="num bv"></td>').join('')}</tr></table>`;
  card.querySelector('.rows').appendChild(row);
}

function rebuildBlockRows(card) {
  const rows = card.querySelectorAll('.brow');
  card.querySelector('.rows').innerHTML = '';
  rows.forEach(() => addBlockRow(card));
}

function generate() {
  const L = [];
  const n = nPeriods();
  const ds = $('delStart').value;
  const periods = Array.from({length: n}, (_, i) => addHours(ds, i));
  L.push(`Area set;${$('area').value}`, `Auction name;${$('auction').value}`, `Auction date time;${iso($('auctionDt').value)}`);

  document.querySelectorAll('#poTable tr:not(:first-child)').forEach(r => {
    const g = c => r.querySelector(c).value;
    L.push(['PO', g('.m'), g('.p'), g('.z'), g('.r'), g('.c'), g('.f')].join(';'));
  });

  document.querySelectorAll('.curve').forEach(card => {
    const g = c => card.querySelector(c).value;
    const prices = g('.prices').split(',').map(s => dec(s.trim())).filter(Boolean);
    L.push(['SL', nextId(), g('.u'), g('.m'), iso(g('.t'))].join(';'));
    L.push(['PR', 'Period', 'OrderPeriodID', 'Active', 'Execution', ...prices.map(p => p.includes(',') ? p : p + ',0')].join(';'));
    card.querySelectorAll('.vl').forEach((r, i) => {
      const vols = [...r.querySelectorAll('.v')].map(x => dec1(x.value));
      L.push(['VL', periods[i], nextId(), g('.a'), (num(r.querySelector('.e').value) === 0 ? '0' : dec1(r.querySelector('.e').value)), ...vols].join(';'));
    });
  });

  document.querySelectorAll('.block').forEach(card => {
    const g = c => card.querySelector(c).value;
    L.push(['SB', g('.u'), g('.m'), iso(g('.t'))].join(';'));
    L.push(['BI', 'BlockID', 'Active', 'Execution', 'MAR', 'AAR', 'BlockCode', 'BlockCodePRM', 'Price', ...periods, ...periods].join(';'));
    card.querySelectorAll('.brow').forEach(r => {
      const q = c => r.querySelector(c).value;
      const vols = [...r.querySelectorAll('.bv')].map(x => dec(x.value));
      const ids = vols.map(v => v === '' ? '' : nextId());
      const exec = q('.ex') !== '' ? dec(q('.ex')) : fmtSum(vols.reduce((s, v) => s + num(v), 0));
      L.push(['BL', nextId(), q('.a'), exec, dec(q('.mar')), q('.aar'), q('.code'), '', dec(q('.price')), ...vols, ...ids].join(';'));
    });
  });

  $('out').textContent = L.join('\r\n');
  return L.join('\r\n');
}

function download() {
  const blob = new Blob([generate() + '\r\n'], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = $('fname').textContent;
  a.click();
}

updateName();
addPO({m: 'ALIPES', p: 'ALIPES-T01', z: 'DK1-ENDK'});
addCurve();
addBlock();
</script>
</body>
</html>
